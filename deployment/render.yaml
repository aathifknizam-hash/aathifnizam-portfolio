services:
  - type: web
    name: aathif-portfolio-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m app.ingestion.build_index"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
